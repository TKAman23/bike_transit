name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Write build-time config from secrets
        run: |
          mkdir -p config
          cat > config/keys.json <<EOF
          {
            "MAPS_API_KEY": "${{ secrets.MAPS_API_KEY }}",
            "OBA_API_KEY": "${{ secrets.OBA_API_KEY }}"
          }
          EOF

      - run: flutter pub get

      - run: flutter test

      - name: Build web (base-href = /${{ github.event.repository.name }}/)
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define-from-file=config/keys.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
